<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Specter watch frame</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; touch-action: none; }
    #frame {
      position: fixed;
      inset: 0;
      box-sizing: border-box;
      border: 6px solid #00e887;
      background: transparent;
      pointer-events: none;
    }
    #label {
      position: absolute;
      top: 14px;
      left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(6, 78, 59, 0.92);
      color: #d1fae5;
      font: 600 12px/1.4 -apple-system, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="frame"><div id="label">Specter đang xem — kéo nhãn để di chuyển, kéo viền để chỉnh</div></div>
  <script type="module" src="./frame.ts"></script>
</body>
</html>
