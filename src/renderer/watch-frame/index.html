<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Specter watch frame</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; touch-action: none; }
    #frame {
      position: fixed;
      inset: 0;
      box-sizing: border-box;
      border: 5px solid rgba(0, 232, 135, 0.82);
      background: transparent;
      pointer-events: none;
    }
    #label {
      position: absolute;
      top: 14px;
      left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(6, 78, 59, 0.92);
      color: #d1fae5;
      font: 600 12px/1.4 -apple-system, sans-serif;
      pointer-events: none;
    }
    #ask {
      position: absolute;
      top: 10px;
      right: 10px;
      border: 0;
      border-radius: 999px;
      padding: 4px 10px;
      background: #00e887;
      color: #052e22;
      font: 700 12px/1.2 -apple-system, sans-serif;
      pointer-events: auto;
      cursor: pointer;
    }
    #ask.is-hover {
      background: #b8ffdf;
      box-shadow: 0 0 0 3px rgba(0, 232, 135, 0.55);
    }
    #ask.is-loading {
      background: #064e3b;
      color: #d1fae5;
      cursor: progress;
    }
    #ask.is-loading::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      border: 2px solid rgba(209, 250, 229, 0.35);
      border-top-color: #d1fae5;
      border-radius: 50%;
      vertical-align: -1px;
      animation: ask-spin 0.7s linear infinite;
    }
    @keyframes ask-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="frame">
    <div id="label">Specter đang xem — kéo nhãn để di chuyển, kéo viền để chỉnh</div>
    <button id="ask" type="button">Gửi</button>
  </div>
  <script type="module" src="./frame.ts"></script>
</body>
</html>
